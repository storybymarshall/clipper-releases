name: Clipper cask

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruby
        run: sudo apt-get update && sudo apt-get install -y ruby
      - name: Validate cask against the live Clipper release
        run: python3 script/validate_cask.py
